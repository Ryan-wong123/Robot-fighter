name: Unity CI

# - Tests (EditMode + PlayMode) on every push and pull request.
# - Android AAB build on manual dispatch or when a version tag (v*) is pushed.
#
# Everything Unity-related is skipped (not failed) until BOTH are true:
#   1. the Unity project exists (ProjectSettings/ProjectVersion.txt), and
#   2. the GameCI license secrets are configured (see task CI-03 in docs/task.md).
#
# Required secrets (Settings -> Secrets and variables -> Actions):
#   UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD      (GameCI activation; for Unity 6 confirm the
#                                                    current method in the GameCI docs [VERIFY])
# Android release signing (task CI-04):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASS, ANDROID_KEYALIAS_NAME, ANDROID_KEYALIAS_PASS
on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'Tools/tasks/**'
  pull_request:
  workflow_dispatch:
    inputs:
      build_android:
        description: 'Also build the Android AAB'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: unity-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f ProjectSettings/ProjectVersion.txt ] && [ -n "$UNITY_LICENSE" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Unity jobs skipped: need ProjectSettings/ProjectVersion.txt and the UNITY_LICENSE secret (see docs/task.md CI-03)."
          fi

  test:
    needs: detect
    if: needs.detect.outputs.ready == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        testMode: [editmode, playmode]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-test-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-test-
      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: ${{ matrix.testMode }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: ${{ matrix.testMode }} results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.testMode }}
          path: artifacts

  build-android:
    needs: [detect, test]
    if: >-
      needs.detect.outputs.ready == 'true' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_dispatch' && inputs.build_android))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-android-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-android-
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          androidExportType: androidAppBundle
          androidKeystoreName: release.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}
      - uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/Android
